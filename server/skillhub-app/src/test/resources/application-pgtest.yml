# Opt-in profile for tests that run against a real PostgreSQL server.
#
# The default test profile uses H2 with Flyway disabled, so it cannot validate
# the PostgreSQL-only SQL of the migration files. Run these tests with:
#
#   SKILLHUB_PG_TESTS=true ./mvnw -pl skillhub-app -am \
#       -Dtest=GitSyncPostgresIntegrationTest -Dsurefire.failIfNoSpecifiedTests=false test
#
# and a server reachable at the URL below (see docs/design/git-sync-and-download-stats.md).
spring:
  datasource:
    url: ${SKILLHUB_PG_URL:jdbc:postgresql://127.0.0.1:55432/skillhub}
    driver-class-name: org.postgresql.Driver
    username: ${SKILLHUB_PG_USER:postgres}
    password: ${SKILLHUB_PG_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true

logging:
  level:
    root: ERROR
    com.iflytek.skillhub: ERROR
    org.springframework: ERROR
    org.flywaydb: INFO
